[package]
name = "xmip-core-path-jsonpath"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-path-jsonpath"
description = "JSONPath path technology: RFC 9535 queries over a JSON Stream — child, descendant, index, slice, wildcard and filter selectors — the first match read, every match written, for promote, demote, route and process. A xmip-core-path technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The PathLanguage trait, the content a compiled path
# reads and the rewriting it writes live in path; the error in contract.
path = { workspace = true }
contract = { workspace = true }
# The character reader every lexer walks its text with.
codec = { workspace = true }
xcore = { workspace = true }

# The one real parser, the same one the json-pointer technology reads with.
# The query language itself is parsed and evaluated here.
serde_json = "1"

[dev-dependencies]
# The Stream fixture, for the tests only (ADR-0044).
contract = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
